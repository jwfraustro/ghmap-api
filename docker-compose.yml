version: '3.8'

services:
  db:
    image: postgres:16
    container_name: ghmap-postgres
    environment:
      POSTGRES_DB: ghmap
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/ghmap
    command: bash -c 'while !</dev/tcp/db/5432; do sleep 1; done; uvicorn ghmap_api.main:app --host 0.0.0.0 --port 8000 --reload'

volumes:
  pgdata:
